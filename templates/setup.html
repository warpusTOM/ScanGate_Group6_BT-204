<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSCQC Portal - First Setup</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="{{ url_for('static', filename='img/cscqcph.png') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="{{ url_for('static', filename='img/cscqcph.png') }}" alt="CSCQC logo">
    <span>PORTAL</span>
  </div>
  <div class="school">
    <h3>COLLEGE OF ST. CATHERINE OF QUEZON CITY</h3>
  </div>
</header>

<main class="center">
  <div class="card">
    <img class="card-logo" src="{{ url_for('static', filename='img/cscqcph.png') }}" alt="logo">
    <h1>First Setup</h1>
    <p class="sub">No admin accounts yet. Create the first one here.
       You can add more later from the admin page.</p>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="post">
      <input name="username" type="text" placeholder="Admin username" autocomplete="off" autofocus>
      <input name="password" type="password" placeholder="Password">
      <input name="password2" type="password" placeholder="Repeat password">
      <button class="btn-green" type="submit">CREATE ADMIN</button>
    </form>
  </div>
</main>

</body>
</html>
