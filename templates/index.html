<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSCQC Portal - IDCheck</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/portal.css') }}">
</head>
<body>

<header class="topbar">
  <div class="brand">
    <img src="{{ url_for('static', filename='img/cscqcph.png') }}" alt="CSCQC logo">
    <span>PORTAL</span>
  </div>
  <div class="school">
    <h3>COLLEGE OF ST. CATHERINE OF QUEZON CITY</h3>
    <span class="pill" id="statPill">loading...</span>
  </div>
</header>

<main class="center">

  <div class="card">
    <img class="card-logo" src="{{ url_for('static', filename='img/cscqcph.png') }}" alt="logo">
    <h1>Student ID Verification</h1>
    <p class="sub">Scan the ID barcode or type the student number, then Enter.</p>

    <input id="scanInput" type="text" placeholder="Student number (e.g. 2026-0001)" autocomplete="off" autofocus>
    <input id="noteInput" type="text" placeholder="Note (optional, e.g. Gate A)">
    <button class="btn-green" id="scanBtn">SCAN / VERIFY</button>

    <div id="result" class="result hidden"></div>
  </div>

  <section class="logs">
    <div class="logs-head">
      <h2>Recent scans</h2>
      <div class="logs-actions">
        <span class="file-note" id="fileNote">load students from a CSV file</span>
        <label class="btn-yellow">
          Choose CSV
          <input type="file" id="csvFile" accept=".csv" hidden>
        </label>
      </div>
    </div>
    <table>
      <thead>
        <tr><th>#</th><th>Student No.</th><th>Time</th><th>Note</th><th>Email</th></tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </section>

  <p class="foot">IDCheck &middot; Group 6 (BT-204) &middot; runs offline, data stays in idcheck.db</p>
</main>

<script src="{{ url_for('static', filename='js/portal.js') }}"></script>
</body>
</html>
